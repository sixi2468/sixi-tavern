# 国内云服务器用：/etc/nginx/sites-available/sixi
# 改三处：server_name、root、证书路径（certbot 会自动写）
server {
    listen 80;
    listen [::]:80;
    server_name notes.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name notes.example.com;

    root /var/www/sixi;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/notes.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/notes.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    # 安全头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 压缩
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    # 静态资源长缓存（文件名不变时最省流量）
    location /assets/ {
        expires 365d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        types { } default_type application/manifest+json;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # 限流（需先在 http{} 里定义 zone，见 deploy/security.md 第三节）
    # limit_conn sixi_conn 20;
    # limit_req zone=sixi_all burst=30 nodelay;
    # location ~ ^/(auth|api/login|api/register) {
    #     limit_req zone=sixi_auth burst=5 nodelay;
    # }
    client_max_body_size 2m;
    client_body_timeout 10s;
    client_header_timeout 10s;
}
